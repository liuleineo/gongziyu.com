<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线视频提取音频 - 视频转MP3/WAV/FLAC - 公子鱼工具箱</title>
<meta name="description" content="在线从视频中提取音频，支持 MP3、WAV、AAC、M4A、OGG、FLAC、OPUS 格式，浏览器本地处理，视频不上传服务器。">
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<style>
  :root {
    --bg: #f0f2f5;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --success: #10b981;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* 头部 */
  .header {
    text-align: center;
    padding: 8px 0 4px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .header h1 .logo {
    width: 46px; height: 46px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px;
    box-shadow: 0 6px 16px rgba(79,70,229,.3);
  }
  .header p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 10px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
  }

  /* 上传区 */
  .upload-area {
    border: 2px dashed #c7d2fe;
    border-radius: 14px;
    padding: 46px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    background: #fafbff;
    margin-bottom: 20px;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .upload-area .up-icon {
    width: 56px; height: 56px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #fff;
  }
  .upload-area .up-title { font-size: 16px; font-weight: 600; }
  .upload-area .up-sub { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
  #file-input { display: none; }

  /* 文件信息 */
  .file-info {
    display: none;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fafbfc;
    margin-bottom: 20px;
  }
  .file-info.show { display: flex; }
  .file-info .fi-icon {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 10px;
    background: var(--primary-light);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .file-info .fi-body { flex: 1; min-width: 0; }
  .file-info .fi-name {
    font-size: 14px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .file-info .fi-meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .file-info .fi-remove {
    border: none; background: none; color: var(--text-secondary);
    cursor: pointer; font-size: 20px; line-height: 1; padding: 6px;
  }
  .file-info .fi-remove:hover { color: #ef4444; }

  /* 表单 */
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 560px) {
    .form-row { grid-template-columns: 1fr; }
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
    letter-spacing: .3px;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fafbfc;
    outline: none;
    transition: all .2s;
    color: var(--text);
  }
  select:focus, input[type="number"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
    background: #fff;
  }
  .trim-hint { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

  /* 按钮 */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    border-radius: 10px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    box-shadow: 0 4px 14px rgba(79,70,229,.35);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79,70,229,.45); }
  .btn-primary:disabled { background: #c7d2fe; box-shadow: none; cursor: not-allowed; transform: none; }
  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .actions { display: flex; gap: 12px; align-items: center; }

  /* 进度 */
  .progress-wrap { display: none; margin-top: 22px; }
  .progress-wrap.show { display: block; }
  .progress-bar {
    height: 10px;
    background: #eef0f4;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar .bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    border-radius: 999px;
    transition: width .3s ease;
  }
  .progress-text {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
  }

  /* 结果 */
  .result { display: none; margin-top: 22px; }
  .result.show { display: block; }
  .result-box {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border-radius: 12px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
  }
  .result-box .ok-icon {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 50%;
    background: var(--success);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .result-box .res-body { flex: 1; min-width: 0; }
  .result-box .res-name {
    font-size: 14px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .result-box .res-meta { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .btn-download {
    background: var(--success);
    color: #fff;
    box-shadow: 0 4px 12px rgba(16,185,129,.35);
    padding: 11px 18px;
    flex-shrink: 0;
  }
  .btn-download:hover { transform: translateY(-1px); }

  .note {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-top: 18px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span class="logo">♪</span>在线视频提取音频</h1>
    <p>从视频中提取音频，支持 MP3 / WAV / FLAC / AAC 等格式 · 浏览器本地处理，视频不上传服务器</p>
  </div>

  <div class="card">
    <!-- 上传 -->
    <div class="upload-area" id="uploadBox">
      <div class="up-icon">🎬</div>
      <div class="up-title">点击或拖拽视频文件到这里</div>
      <div class="up-sub">支持 MP4 / MOV / WEBM / MKV / AVI / M4V 等常见格式</div>
      <input type="file" id="file-input" accept="video/*,.mkv,.avi,.flv,.mov,.wmv,.m4v">
    </div>

    <!-- 文件信息 -->
    <div class="file-info" id="fileInfo">
      <div class="fi-icon">🎞️</div>
      <div class="fi-body">
        <div class="fi-name" id="fileName"></div>
        <div class="fi-meta" id="fileMeta"></div>
      </div>
      <button class="fi-remove" id="removeBtn" title="移除文件">✕</button>
    </div>

    <!-- 设置 -->
    <div class="form-row">
      <div class="form-group">
        <label>输出格式</label>
        <select id="formatSelect">
          <option value="mp3" selected>MP3（通用，推荐）</option>
          <option value="wav">WAV（无损）</option>
          <option value="flac">FLAC（无损压缩）</option>
          <option value="aac">AAC（.aac）</option>
          <option value="m4a">M4A（.m4a）</option>
          <option value="ogg">OGG（.ogg）</option>
          <option value="opus">OPUS（.opus）</option>
        </select>
      </div>
      <div class="form-group" id="bitrateGroup">
        <label>音频码率（仅 MP3/AAC/M4A）</label>
        <select id="bitrateSelect">
          <option value="128">128 kbps</option>
          <option value="192" selected>192 kbps</option>
          <option value="256">256 kbps</option>
          <option value="320">320 kbps</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>开始时间（秒，可留空）</label>
        <input type="number" id="startTime" min="0" step="0.1" placeholder="例如 0">
      </div>
      <div class="form-group">
        <label>结束时间（秒，可留空）</label>
        <input type="number" id="endTime" min="0" step="0.1" placeholder="例如 60">
      </div>
    </div>
    <div class="trim-hint">💡 填写开始/结束时间可只提取视频中的某一段音频，留空则提取完整音频。</div>

    <div class="actions" style="margin-top:20px;">
      <button class="btn btn-primary" id="convertBtn" disabled>🎵 提取音频</button>
      <button class="btn btn-ghost" id="clearBtn">清空</button>
    </div>

    <!-- 进度 -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div class="bar" id="progressBar"></div></div>
      <div class="progress-text" id="progressText">准备中…</div>
    </div>

    <!-- 结果 -->
    <div class="result" id="resultBox">
      <div class="result-box">
        <div class="ok-icon">✓</div>
        <div class="res-body">
          <div class="res-name" id="resultName"></div>
          <div class="res-meta" id="resultMeta"></div>
        </div>
        <button class="btn btn-download" id="downloadBtn">⬇ 下载</button>
      </div>
    </div>

    <div class="note">
      全程在本地浏览器内使用 FFmpeg (WebAssembly) 完成，无需上传视频。<br>
      首次转换需加载约 30MB 的内核，请耐心等待；处理大文件可能较慢。
    </div>
  </div>
</div>

<script>
(function () {
  const { FFmpeg } = FFmpegWASM;
  const { fetchFile, toBlobURL } = FFmpegUtil;

  const uploadBox = document.getElementById('uploadBox');
  const fileInput = document.getElementById('file-input');
  const fileInfo = document.getElementById('fileInfo');
  const fileName = document.getElementById('fileName');
  const fileMeta = document.getElementById('fileMeta');
  const removeBtn = document.getElementById('removeBtn');
  const formatSelect = document.getElementById('formatSelect');
  const bitrateGroup = document.getElementById('bitrateGroup');
  const bitrateSelect = document.getElementById('bitrateSelect');
  const startTime = document.getElementById('startTime');
  const endTime = document.getElementById('endTime');
  const convertBtn = document.getElementById('convertBtn');
  const clearBtn = document.getElementById('clearBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const resultBox = document.getElementById('resultBox');
  const resultName = document.getElementById('resultName');
  const resultMeta = document.getElementById('resultMeta');
  const downloadBtn = document.getElementById('downloadBtn');

  let currentFile = null;
  let currentDuration = 0;
  let outputBlob = null;
  let outputFilename = '';
  let ffmpeg = null;
  let loadingFFmpeg = false;
  let processing = false;

  // 格式配置
  const FORMATS = {
    mp3:  { ext: 'mp3',  mime: 'audio/mpeg',  args: (br) => ['-c:a', 'libmp3lame', '-b:a', br + 'k'] },
    wav:  { ext: 'wav',  mime: 'audio/wav',   args: () => ['-c:a', 'pcm_s16le'] },
    flac: { ext: 'flac', mime: 'audio/flac',  args: () => ['-c:a', 'flac'] },
    aac:  { ext: 'aac',  mime: 'audio/aac',   args: (br) => ['-c:a', 'aac', '-b:a', br + 'k', '-f', 'adts'] },
    m4a:  { ext: 'm4a',  mime: 'audio/mp4',   args: (br) => ['-c:a', 'aac', '-b:a', br + 'k', '-f', 'mp4'] },
    ogg:  { ext: 'ogg',  mime: 'audio/ogg',   args: () => ['-c:a', 'libvorbis'] },
    opus: { ext: 'opus', mime: 'audio/ogg',   args: () => ['-c:a', 'libopus', '-f', 'ogg'] }
  };

  function formatSize(bytes) {
    if (bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(i >= 2 ? 2 : 0) + ' ' + units[i];
  }

  function formatDuration(sec) {
    if (!isFinite(sec) || sec < 0) return '--';
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    const pad = n => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  function sanitizeBaseName(name) {
    return name.replace(/\.[^/.]+$/, '') || 'audio';
  }

  function setStatus(text, pct) {
    progressText.textContent = text;
    if (typeof pct === 'number') progressBar.style.width = Math.min(100, Math.max(0, pct)) + '%';
  }

  // 上传区事件
  uploadBox.onclick = () => fileInput.click();
  uploadBox.ondragover = e => { e.preventDefault(); uploadBox.classList.add('dragover'); };
  uploadBox.ondragleave = () => uploadBox.classList.remove('dragover');
  uploadBox.ondrop = e => {
    e.preventDefault();
    uploadBox.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files && files[0]) setFile(files[0]);
  };
  fileInput.onchange = () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
    fileInput.value = '';
  };

  function setFile(file) {
    if (!file) return;
    currentFile = file;
    resultBox.classList.remove('show');
    outputBlob = null;
    convertBtn.disabled = true;

    fileName.textContent = file.name;
    fileMeta.textContent = `${formatSize(file.size)} · 正在读取时长…`;
    fileInfo.classList.add('show');

    // 读取视频时长
    const video = document.createElement('video');
    video.preload = 'metadata';
    const url = URL.createObjectURL(file);
    video.onloadedmetadata = () => {
      currentDuration = video.duration || 0;
      fileMeta.textContent = `${formatSize(file.size)} · 时长 ${formatDuration(currentDuration)}`;
      URL.revokeObjectURL(url);
      convertBtn.disabled = false;
    };
    video.onerror = () => {
      currentDuration = 0;
      fileMeta.textContent = formatSize(file.size);
      URL.revokeObjectURL(url);
      convertBtn.disabled = false; // 允许尝试用 ffmpeg 解析
    };
    video.src = url;
  }

  removeBtn.onclick = clearAll;
  clearBtn.onclick = clearAll;

  function clearAll() {
    currentFile = null;
    currentDuration = 0;
    outputBlob = null;
    outputFilename = '';
    fileInput.value = '';
    fileInfo.classList.remove('show');
    resultBox.classList.remove('show');
    progressWrap.classList.remove('show');
    progressBar.style.width = '0';
    convertBtn.disabled = true;
  }

  // 码率选项联动：mp3/aac/m4a 显示码率
  function updateBitrateVisibility() {
    const fmt = formatSelect.value;
    bitrateGroup.style.opacity = ['mp3', 'aac', 'm4a'].includes(fmt) ? '1' : '0.4';
    bitrateSelect.disabled = !['mp3', 'aac', 'm4a'].includes(fmt);
  }
  formatSelect.onchange = updateBitrateVisibility;
  updateBitrateVisibility();

  async function loadFFmpeg() {
    if (ffmpeg) return ffmpeg;
    if (loadingFFmpeg) {
      while (!ffmpeg) await new Promise(r => setTimeout(r, 200));
      return ffmpeg;
    }
    loadingFFmpeg = true;
    const coreBase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
    setStatus('正在下载 FFmpeg 内核（约 30MB，仅首次需要）…');
    try {
      const instance = new FFmpeg();
      instance.on('progress', ({ progress }) => {
        if (progress >= 0 && progress <= 1) {
          setStatus('正在转换音频…', Math.round(progress * 100));
        }
      });
      await instance.load({
        coreURL: await toBlobURL(`${coreBase}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${coreBase}/ffmpeg-core.wasm`, 'application/wasm')
      });
      ffmpeg = instance;
      return instance;
    } catch (err) {
      console.error(err);
      throw new Error('FFmpeg 内核加载失败：' + (err && err.message ? err.message : err));
    } finally {
      loadingFFmpeg = false;
    }
  }

  convertBtn.onclick = async () => {
    if (!currentFile || processing) return;
    processing = true;
    convertBtn.disabled = true;
    resultBox.classList.remove('show');
    progressWrap.classList.add('show');
    progressBar.style.width = '0';
    outputBlob = null;

    try {
      const fmt = FORMATS[formatSelect.value];
      const bitrate = bitrateSelect.value;
      const instance = await loadFFmpeg();

      // 内部使用 ASCII 文件名，避免虚拟文件系统中文名问题
      const ext = (currentFile.name.match(/\.([^.]+)$/) || [])[1] || 'mp4';
      const inputName = 'input.' + ext.toLowerCase().replace(/[^a-z0-9]/g, '');
      const outputName = 'output.' + fmt.ext;
      const baseName = sanitizeBaseName(currentFile.name);

      setStatus('正在写入文件…');
      const data = await fetchFile(currentFile);
      await instance.writeFile(inputName, data);

      const args = [];
      const start = parseFloat(startTime.value);
      const end = parseFloat(endTime.value);
      if (!isNaN(start) && start >= 0) args.push('-ss', String(start));
      args.push('-i', inputName, '-vn', ...fmt.args(bitrate));
      if (!isNaN(end) && end > 0) args.push('-to', String(end));
      args.push('-y', outputName);

      await instance.exec(args);

      setStatus('正在读取结果…', 100);
      const outData = await instance.readFile(outputName);
      const bytes = outData instanceof Uint8Array ? outData : outData.buffer;

      outputBlob = new Blob([bytes], { type: fmt.mime });
      outputFilename = baseName + '.' + fmt.ext;

      // 清理虚拟文件，释放内存
      try {
        await instance.deleteFile(inputName);
        await instance.deleteFile(outputName);
      } catch (e) { /* ignore */ }

      resultName.textContent = outputFilename;
      resultMeta.textContent = `${fmt.ext.toUpperCase()} · ${formatSize(outputBlob.size)}`;
      resultBox.classList.add('show');
      setStatus('转换完成！');
    } catch (err) {
      console.error(err);
      setStatus('转换失败：' + (err && err.message ? err.message : err));
    } finally {
      processing = false;
      convertBtn.disabled = !currentFile;
    }
  };

  downloadBtn.onclick = () => {
    if (!outputBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(outputBlob);
    a.download = outputFilename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 1000);
  };
})();
</script>
</body>
</html>
